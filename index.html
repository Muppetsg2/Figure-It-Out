<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- AUTHOR: Marceli Antosik (Muppetsg2) -->
        <meta charset="UTF-8">
        <!-- Mobile viewport: real device width, zooming disabled (GAME.svg alone cannot set this) -->
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
        <meta name="theme-color" content="#CA224B">
        <title>Figure It Out</title>
		<meta name="description" content="Simple Java Script game about changing shapes.">
        <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
        <link rel="icon" href="icons/favicon.png" sizes="image/png">
        <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" type="image/png">
        <style>
            html, body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: white;
                touch-action: none;
                overscroll-behavior: none;
                -webkit-user-select: none;
                user-select: none;
                -webkit-text-size-adjust: 100%;
            }

            #game {
                position: fixed;
                inset: 0;
                width: 100%;
                height: 100%;
                height: 100dvh;
                border: 0;
                display: block;
            }
        </style>
        <script>
            // The game itself lives in GAME.svg and is embedded in this page, so that:
            //  - the browser tab shows the favicon and title from this page,
            //  - on phones the viewport settings above block zooming.
            const isTouch = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
        </script>
    </head>
    <body>
        <script>
            const frame = document.createElement("iframe");
            frame.id = "game";
            frame.title = "Figure It Out";
            frame.src = "GAME.svg";
            frame.setAttribute("allow", "autoplay; fullscreen");
            document.body.appendChild(frame);

            // Keyboard input must go to the game, not to this page
            const focusGame = () => frame.contentWindow.focus();
            frame.addEventListener("load", focusGame);
            window.addEventListener("focus", focusGame);

            // If a key still lands on this page, pass it to the game and move the focus there
            document.addEventListener("keydown", (event) => {
                focusGame();
                frame.contentDocument.dispatchEvent(new KeyboardEvent("keydown", {
                    key: event.key,
                    code: event.code,
                    ctrlKey: event.ctrlKey,
                    shiftKey: event.shiftKey,
                    altKey: event.altKey,
                    metaKey: event.metaKey,
                    bubbles: true
                }));
            });

            if (isTouch) {
                // Block zoom gestures that start outside the game frame (iOS)
                for (const type of ["gesturestart", "gesturechange", "gestureend", "dblclick"]) {
                    document.addEventListener(type, (event) => event.preventDefault(), { passive: false });
                }
                document.addEventListener("touchstart", (event) => event.preventDefault(), { passive: false });
            }
        </script>
        <noscript><a href="GAME.svg">Play Figure It Out</a></noscript>
    </body>
</html>
